name: Credential Status Update

on:
  push:
    paths:
      - '.github/workflows/credential-status-update.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update certification status across public site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Home page visible credential block.
          replace_exact(
              'index.html',
              '<p><strong>Currently held:</strong> CompTIA Security+, ITIL v3 Foundation, VMware VCP5-DCV.</p><p><strong>ISC2 Certified in Cybersecurity (CC):</strong> Official Pearson VUE examination provisionally passed August 6, 2026; final ISC2 credential processing pending.</p><p class="note"><strong>Previously held:</strong> CISSP, CISM, CISA, CCNP Enterprise, CCDP, CCSE, CCNA, and CCDA. Previous credentials are identified as historical, not current.</p>',
              '<p><strong>Currently held:</strong> CompTIA Security+, ISC2 Certified in Cybersecurity (CC), and ITIL v3 Foundation.</p><p class="note"><strong>Previously held / expired:</strong> VMware VCP5-DCV, CISSP, CISM, CISA, CCNP Enterprise, CCDP, CCSE, CCNA, and CCDA. Historical or expired credentials are not presented as current.</p>'
          )
          replace_exact('index.html', '"dateModified":"2026-08-06"', '"dateModified":"2026-08-24"')

          # Recruiter brief credential panel.
          replace_exact(
              'recruiter-brief.html',
              '<p><strong>Currently held:</strong> CompTIA Security+, ITIL v3 Foundation, VMware VCP5-DCV.</p>\n      <p class="note"><strong>Previously held:</strong> CISSP, CISM, CISA, CCNP Enterprise, CCDP, CCSE, CCNA, and CCDA. Historical credentials are not presented as current.</p>',
              '<p><strong>Currently held:</strong> CompTIA Security+, ISC2 Certified in Cybersecurity (CC), and ITIL v3 Foundation.</p>\n      <p class="note"><strong>Previously held / expired:</strong> VMware VCP5-DCV, CISSP, CISM, CISA, CCNP Enterprise, CCDP, CCSE, CCNA, and CCDA. Historical or expired credentials are not presented as current.</p>'
          )

          # Engineering and Leadership online ATS resumes.
          old_resume = '<p><strong>Current Certifications:</strong> CompTIA Security+ | ITIL v3 Foundation | VMware VCP5-DCV</p><p><strong>Pending ISC2 Credential:</strong> Certified in Cybersecurity (CC) — official examination provisionally passed August 6, 2026; final ISC2 credential processing and issuance pending</p><p><strong>Previously Held:</strong> CISSP | CISM | CISA | CCNP Enterprise | CCDP | CCSE | CCNA | CCDA</p>'
          new_resume = '<p><strong>Current Certifications:</strong> CompTIA Security+ | ISC2 Certified in Cybersecurity (CC) | ITIL v3 Foundation</p><p><strong>Previously Held / Expired:</strong> VMware VCP5-DCV | CISSP | CISM | CISA | CCNP Enterprise | CCDP | CCSE | CCNA | CCDA</p>'
          replace_exact('resume-tech.html', old_resume, new_resume)
          replace_exact('resume-leadership.html', old_resume, new_resume)

          # FAQ: visible answer and JSON-LD answer used by search engines.
          replace_exact(
              'faq.html',
              'Currently held credentials are CompTIA Security+, ITIL v3 Foundation, and VMware VCP5-DCV. CISSP, CISM, CISA, CCNP Enterprise, CCDP, CCSE, CCNA, and CCDA are identified as previously held rather than current.',
              'Currently held credentials are CompTIA Security+, ISC2 Certified in Cybersecurity (CC), and ITIL v3 Foundation. VMware VCP5-DCV is expired; CISSP, CISM, CISA, CCNP Enterprise, CCDP, CCSE, CCNA, and CCDA are previously held credentials rather than current.'
          )
          replace_exact(
              'faq.html',
              '<p><strong>Currently held:</strong> CompTIA Security+, ITIL v3 Foundation, and VMware VCP5-DCV.</p><p><strong>Previously held:</strong> CISSP, CISM, CISA, CCNP Enterprise, CCDP, CCSE, CCNA, and CCDA.</p><p>Historical credentials are disclosed as previous credentials and are not represented as active.</p>',
              '<p><strong>Currently held:</strong> CompTIA Security+, ISC2 Certified in Cybersecurity (CC), and ITIL v3 Foundation.</p><p><strong>Previously held / expired:</strong> VMware VCP5-DCV, CISSP, CISM, CISA, CCNP Enterprise, CCDP, CCSE, CCNA, and CCDA.</p><p>Historical or expired credentials are disclosed accurately and are not represented as active.</p>'
          )

          # Guard against reintroducing the stale claims on the public pages being updated.
          for name in ['index.html', 'recruiter-brief.html', 'resume-tech.html', 'resume-leadership.html', 'faq.html']:
              text = Path(name).read_text(encoding='utf-8')
              if 'Pending ISC2 Credential' in text or 'final ISC2 credential processing pending' in text or 'final ISC2 credential processing and issuance pending' in text:
                  raise SystemExit(f'{name}: stale ISC2 pending language remains')
          PY

      - name: Commit website corrections
        shell: bash
        run: |
          git config user.name "David C. Fields website automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html recruiter-brief.html resume-tech.html resume-leadership.html faq.html
          git diff --cached --check
          git commit -m "Confirm ISC2 CC and mark VCP5-DCV expired"
          git push
