name: Update Resume Version Labels to v1.3

on:
  push:
    paths:
      - '.github/workflows/update-resume-version-v13.yml'

permissions:
  contents: write

jobs:
  update-version-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update current resume version references
        run: |
          sed -i 's/v1\.2/v1.3/g' resume-tech.html resume-leadership.html

          echo "Remaining v1.2 references in current resume pages:"
          if grep -n 'v1\.2' resume-tech.html resume-leadership.html; then
            echo "Unexpected v1.2 reference remains"
            exit 1
          else
            echo "None"
          fi

          echo "Updated v1.3 references:"
          grep -n 'v1\.3' resume-tech.html resume-leadership.html

      - name: Commit version-label corrections and remove temporary workflow
        run: |
          git config user.name "David C. Fields website automation"
          git config user.email "actions@users.noreply.github.com"
          git add resume-tech.html resume-leadership.html
          git rm .github/workflows/update-resume-version-v13.yml
          git commit -m "Update online resume labels to v1.3"
          git push
