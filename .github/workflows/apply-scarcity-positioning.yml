name: One-time scarcity positioning build

on:
  push:
    branches:
      - scarcity-positioning-2026
    paths:
      - .github/workflows/apply-scarcity-positioning.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: scarcity-positioning-2026

      - name: Apply focused positioning package
        run: python .github/scripts/apply_scarcity_positioning.py

      - name: Validate generated site
        run: python .github/scripts/validate_site.py

      - name: Remove one-time builder
        run: |
          rm -f .github/scripts/apply_scarcity_positioning.py
          rm -f .github/workflows/apply-scarcity-positioning.yml

      - name: Commit focused positioning package
        run: |
          git config user.name "David C. Fields, M.S."
          git config user.email "david.fields@lhdl.io"
          git add -A
          git commit -m "Add focused infrastructure automation and security positioning"
          git push origin scarcity-positioning-2026
