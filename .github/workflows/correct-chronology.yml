name: One-time public chronology correction

on:
  push:
    branches:
      - chronology-corrections-2026
    paths:
      - .github/workflows/correct-chronology.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chronology-corrections-2026

      - name: Apply chronology corrections
        run: python .github/scripts/correct_chronology.py

      - name: Remove one-time automation files
        run: |
          rm -f .github/scripts/correct_chronology.py
          rm -f .github/workflows/correct-chronology.yml

      - name: Commit corrections
        run: |
          git config user.name "David C. Fields, M.S."
          git config user.email "david.fields@lhdl.io"
          git add -A
          git commit -m "Correct public career chronology"
          git push origin chronology-corrections-2026
