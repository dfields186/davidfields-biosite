name: One-time embedded Calendly scheduling build

on:
  push:
    branches:
      - embedded-calendly-scheduling-2026

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: embedded-calendly-scheduling-2026
          fetch-depth: 0

      - name: Build scheduling page and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_embedded_scheduling.py')
          text = path.read_text(encoding='utf-8')
          old = 'href="contact\\.html"'
          new = 'href="(?:contact\\.html|index\\.html#contact)"'
          if old not in text:
              raise RuntimeError('Expected contact CTA matcher not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/scripts/apply_embedded_scheduling.py

      - name: Validate site
        run: python .github/scripts/validate_site.py

      - name: Commit generated changes and remove one-time files
        run: |
          git config user.name "David C. Fields, M.S."
          git config user.email "david.fields@lhdl.io"
          git rm -f .github/workflows/apply-embedded-scheduling.yml .github/scripts/apply_embedded_scheduling.py
          git add .
          git commit -m "Add embedded Calendly scheduling experience"
          git push origin embedded-calendly-scheduling-2026
