name: One-time SEO foundation build

on:
  push:
    branches:
      - seo-foundation-2026
    paths:
      - .github/workflows/apply-seo-foundation.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-foundation-2026

      - name: Apply SEO foundation
        run: python .github/scripts/apply_seo_foundation.py

      - name: Validate generated site
        run: python .github/scripts/validate_site.py

      - name: Remove one-time and unsupported workflow files
        run: |
          rm -f .github/scripts/apply_seo_foundation.py
          rm -f .github/workflows/apply-seo-foundation.yml
          rm -f .github/workflows/site-quality.yml

      - name: Commit SEO foundation
        run: |
          git config user.name "David C. Fields, M.S."
          git config user.email "david.fields@lhdl.io"
          git add -A
          git commit -m "Add technical SEO and indexing foundation"
          git push origin seo-foundation-2026
